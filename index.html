<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midtown Camera Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ground:#12161b;
    --panel:#191e25;
    --panel-2:#20262f;
    --line:#2c343f;
    --ink:#e6e9ee;
    --ink-dim:#9aa5b3;
    --ink-faint:#6b7684;
    --amber:#f0a132;
    --amber-soft:#3a2c14;
    --live:#4ec98a;
    --stale:#e0b341;
    --dead:#e0644f;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:"Archivo",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;
  }
  .shell{display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}

  /* ---------- rail ---------- */
  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:15px 16px 12px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .brand p{margin:4px 0 0;font-size:11px;color:var(--ink-faint);letter-spacing:.09em;text-transform:uppercase}

  .filters{padding:11px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
  .search{
    width:100%;padding:7px 9px;background:var(--ground);color:var(--ink);
    border:1px solid var(--line);border-radius:var(--radius);font:inherit;font-size:13px;
  }
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{outline:2px solid var(--amber);outline-offset:-1px;border-color:var(--amber)}
  .tally{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}

  .rail-scroll{overflow-y:auto;flex:1;min-height:0;padding-bottom:12px}
  .grp{
    padding:12px 16px 5px;font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-faint);
    position:sticky;top:0;background:var(--panel);
  }
  .cam{
    width:100%;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;
    padding:6px 16px;background:none;border:0;border-left:2px solid transparent;
    color:var(--ink-dim);font:inherit;font-size:13px;text-align:left;cursor:pointer;
  }
  .cam:hover{background:var(--panel-2);color:var(--ink)}
  .cam:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .cam[aria-current="true"]{background:var(--amber-soft);border-left-color:var(--amber);color:var(--ink);font-weight:600}
  .cam .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cam .dist{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);font-weight:400}
  .cam.off .nmx{opacity:.5}
  .cam.off .dist{color:var(--dead)}
  .empty{padding:18px 16px;color:var(--ink-faint);font-size:12.5px;line-height:1.5}

  .place{
    width:100%;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:8px;
    padding:7px 16px;background:none;border:0;border-left:2px solid transparent;
    color:var(--ink-dim);font:inherit;font-size:13px;text-align:left;cursor:pointer;
  }
  .place:hover{background:var(--panel-2);color:var(--ink)}
  .place:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .place .pin{color:var(--amber);font-size:11px;line-height:1.3}
  .place .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place .sub{
    grid-column:2;font-family:"IBM Plex Mono",monospace;font-size:10px;
    color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .searching{
    padding:7px 16px;font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em;
  }
  .place-pin{
    width:15px;height:15px;border-radius:50%;
    background:#fff;border:3px solid var(--amber);
    box-shadow:0 0 0 4px rgba(240,161,50,.22);
  }

  /* ---------- stage ---------- */
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0}
  .bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .bar h2{margin:0;font-size:15px;font-weight:600}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .seg button{
    background:var(--panel-2);border:0;border-right:1px solid var(--line);
    color:var(--ink-dim);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer;
  }
  .seg button:last-child{border-right:0}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--amber);color:#1a1205;font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .seg .lbl{
    background:var(--panel);color:var(--ink-faint);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:6px 8px;border-right:1px solid var(--line);
    display:flex;align-items:center;
  }
  .status{
    display:inline-flex;align-items:center;gap:7px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-dim);letter-spacing:.04em;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
  .dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(78,201,138,.16)}
  .dot.stale{background:var(--stale)}
  .dot.dead{background:var(--dead)}

  /* ---------- map ---------- */
  .mapwrap{position:relative;height:330px;flex:none;border-bottom:1px solid var(--line)}
  .mapwrap.collapsed{height:0;border-bottom:0;overflow:hidden}
  #map{position:absolute;inset:0;background:#0d1014}
  /* Left edge clears Leaflet's zoom control; buttons wrap rather than cover it. */
  .maphud{
    position:absolute;right:10px;top:10px;left:56px;z-index:500;
    display:flex;gap:6px;align-items:flex-start;justify-content:flex-end;flex-wrap:wrap;
  }
  /* OSM ships no keyless dark tiles, so invert them into one. */
  .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.85) saturate(.22)}
  .hudbtn{
    background:rgba(25,30,37,.94);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--ink-dim);font:inherit;font-size:11px;padding:5px 9px;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;
  }
  .hudbtn:hover{color:var(--ink)}
  .hudbtn[aria-pressed="true"]{background:var(--amber);color:#1a1205;border-color:var(--amber);font-weight:500}
  .hudbtn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  .maphint{
    position:absolute;left:10px;bottom:10px;z-index:500;
    background:rgba(25,30,37,.94);border:1px solid var(--line);border-radius:var(--radius);
    padding:5px 9px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-dim);
    pointer-events:none;
  }
  .splitter{
    height:7px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);
    cursor:ns-resize;display:grid;place-items:center;
  }
  .splitter::after{content:"";width:34px;height:2px;border-radius:2px;background:var(--line)}
  .splitter:hover::after{background:var(--amber)}

  /* Leaflet chrome, themed */
  .leaflet-container{background:#0d1014;font-family:"Archivo",sans-serif}
  .leaflet-bar a{
    background:rgba(25,30,37,.96);color:var(--ink-dim);
    border-bottom-color:var(--line);
  }
  .leaflet-bar a:hover{background:var(--panel-2);color:var(--ink)}
  .leaflet-control-attribution{
    background:rgba(18,22,27,.82)!important;color:var(--ink-faint)!important;font-size:10px!important;
  }
  .leaflet-control-attribution a{color:var(--ink-dim)!important}
  .leaflet-tooltip{
    background:rgba(25,30,37,.96);border:1px solid var(--line);color:var(--ink);
    font-size:11.5px;box-shadow:none;
  }
  .leaflet-tooltip::before{border-top-color:var(--line)}

  /* ---------- wall ---------- */
  .viewport{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
  .wall{display:grid;gap:11px;width:100%}
  .wall.n1{grid-template-columns:minmax(0,1fr);max-width:840px}
  .wall.n4{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1160px}
  .wall.n6{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1480px;gap:9px}
  .wall.n10{grid-template-columns:repeat(5,minmax(0,1fr));max-width:1800px;gap:8px}

  .feed{background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer}
  .feed.sel{border-color:var(--amber)}
  .feed-img{position:relative;aspect-ratio:352/240;width:100%;max-width:100%;background:#000}
  .feed-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s linear}
  .feed-img img.on{opacity:1}
  .feed-img video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .feed-img iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .feed.isembed{border-color:#6b4fa8}
  .feed.isembed .badge{color:#b79cf0;border-color:#6b4fa8}
  .feed.isvideo{border-color:#2f6b4f}
  .feed.isvideo.sel{border-color:var(--amber)}
  .badge{
    position:absolute;left:6px;top:6px;z-index:2;
    background:rgba(18,22,27,.82);border:1px solid var(--live);color:var(--live);
    border-radius:2px;padding:1px 5px;
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  }
  .feed-img .msg[hidden]{display:none}
  .feed-img .msg{
    position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:8px;
    color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;
  }
  .feed-meta{
    display:flex;align-items:baseline;gap:8px;padding:6px 9px;
    background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;min-width:0;
  }
  .feed-meta .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .feed-meta .co{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);white-space:nowrap}
  .wall.n10 .feed-meta .co{display:none}

  a{color:var(--amber)}

  @media (prefers-reduced-motion:reduce){.feed-img img{transition:none}}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;height:auto}
    .rail{border-right:0;border-bottom:1px solid var(--line)}
    .rail-scroll{max-height:190px}
    .mapwrap{height:280px}
    .wall.n6,.wall.n10{grid-template-columns:repeat(2,minmax(0,1fr))}
    .viewport{padding:13px}
    .bar,.brand,.filters{padding-left:16px;padding-right:16px}
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="brand">
      <h1>Midtown Camera Wall</h1>
      <p>NYC DOT / TMC public feeds</p>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Address, place, or camera name" autocomplete="off" aria-label="Search an address, place, or camera">
      <div class="tally" id="tally">loading camera index…</div>
    </div>
    <div class="rail-scroll" id="rail"></div>
  </aside>

  <main class="stage">
    <div class="bar">
      <h2 id="curName">Broadway @ 51 St</h2>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></span>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Refresh rate">
        <span class="lbl">Rate</span>
        <button data-ms="1000" aria-pressed="true">1s</button>
        <button data-ms="2000" aria-pressed="false">2s</button>
        <button data-ms="5000" aria-pressed="false">5s</button>
        <button data-ms="0" aria-pressed="false">Hold</button>
      </div>
      <div class="seg" role="group" aria-label="Number of tiles">
        <span class="lbl">Wall</span>
        <button data-n="1" aria-pressed="true">1</button>
        <button data-n="4" aria-pressed="false">4</button>
        <button data-n="6" aria-pressed="false">6</button>
        <button data-n="10" aria-pressed="false">10</button>
      </div>
      <div class="seg" role="group" aria-label="Map">
        <button id="btnMap" aria-pressed="true">Map</button>
      </div>
    </div>

    <div class="mapwrap" id="mapwrap">
      <div id="map"></div>
      <div class="maphud">
        <button class="hudbtn" id="btnFollow" aria-pressed="true" title="Rebuild the wall from whatever is in view">Follow view</button>
        <button class="hudbtn" id="btnLayer" title="Switch between the street map and satellite imagery">Satellite</button>
        <button class="hudbtn" id="btnHome" title="Back to W 53rd St &amp; Broadway">W 53rd</button>
        <button class="hudbtn" id="btnAll" title="Zoom out to the whole five-borough network">All NYC</button>
      </div>
      <div class="maphint" id="maphint">—</div>
    </div>
    <div class="splitter" id="splitter" role="separator" aria-label="Resize map" tabindex="0"></div>

    <div class="viewport"><div class="wall n1" id="wall"></div></div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
/* Default view: August Wilson Theatre, W 52nd–54th between 8 Av and Broadway */
const PIN  = {lat:40.7626, lon:-73.9840, zoom:16};
/* Still-frame URLs now differ by source, so each camera carries its own. */
function frameUrl(cam){
  const base = cam._resolved || cam.g;        // Mesonet cams resolve at runtime (see below)
  if (!base) return "";
  return base + (base.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
}

/* NYS Mesonet publishes one still per hour under a URL keyed by epoch second, so
   the current frame's URL is only knowable by asking the list API. Resolve it and
   cache on the cam; re-resolve every few minutes. CORS is open. */
function resolveMesonet(cam){
  const pad = n => String(n).padStart(2, "0");
  const fmt = d => d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + "T" +
                   pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds());
  const now = new Date(), then = new Date(now - 4*3600*1000);
  const api = "https://api.nysmesonet.org/cam/index.php/list/nysm/" + cam.m + "/" + fmt(then) + "/" + fmt(now);
  return fetch(api).then(r => r.json()).then(j => {
    const ph = (j.photos || []);
    if (ph.length) cam._resolved = ph[ph.length - 1].url;
    return cam._resolved;
  }).catch(() => null);
}

/* Fallback set, used when cameras.json can't be fetched (e.g. opened off disk). */
const TMC = id => "https://webcams.nyctmc.org/api/cameras/" + id + "/image";
const SEED = [
  {i:"3d8e276f-b179-414d-a506-679d5e559d3e", n:"Broadway @ 51 St",            a:"Manhattan", y:40.76142, x:-73.98430, o:1, s:0},
  {i:"0a49d947-2a5b-498d-a386-2cef5ce883fa", n:"50 St Btwn 8 Ave & Broadway", a:"Manhattan", y:40.76163, x:-73.98551, o:1, s:0},
  {i:"fc7db899-7a79-41f3-b9b1-b23ce64c5a5e", n:"7 Ave @ 49 St",               a:"Manhattan", y:40.76062, x:-73.98401, o:1, s:0},
  {i:"4850e464-1111-4b5d-a72d-f54a0e12a789", n:"8 Ave @ 49 St",               a:"Manhattan", y:40.76139, x:-73.98663, o:1, s:0},
  {i:"4ebe49c8-3e68-43f7-b415-da3db9f72693", n:"7 Ave @ 54 St",               a:"Manhattan", y:40.76434, x:-73.98212, o:1, s:0},
  {i:"f3d82b25-6b10-44c7-ae89-30df075a7ac8", n:"Broadway @ 46 St- Quad North",a:"Manhattan", y:40.75904, x:-73.98531, o:1, s:0},
  {i:"dbbf45f6-7d87-46fa-825f-454a7e2bbcad", n:"Broadway @ 46 St- Quad East", a:"Manhattan", y:40.75901, x:-73.98529, o:1, s:0},
  {i:"1927b469-e2dc-4943-a70c-e6e52fd4c48c", n:"Broadway @ 46 St- Quad South",a:"Manhattan", y:40.75899, x:-73.98530, o:1, s:0},
  {i:"8cd15417-5b79-4065-9165-4b6ff0ff3f53", n:"Broadway @ 46 St- Quad West", a:"Manhattan", y:40.75903, x:-73.98534, o:1, s:0}
].map(c => ({...c, g: TMC(c.i)}));

let ALL    = SEED.slice();
let byId   = new Map();
let query  = "";
let tiles  = 1;
let period = 1000;
let follow = true;
let anchor = SEED[0];
let feeds  = [];
let timer  = null;
let markers = new Map();

const wall  = document.getElementById("wall");
const rail  = document.getElementById("rail");
const dot   = document.getElementById("dot");
const stat  = document.getElementById("statusText");
const curNm = document.getElementById("curName");
const tally = document.getElementById("tally");
const hint  = document.getElementById("maphint");

const fmt = m => m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1) + " km";
function metresFrom(c, lat, lon){
  return Math.hypot((c.y - lat) * 111000, (c.x - lon) * 84000 * Math.cos(lat * Math.PI / 180) / Math.cos(40.75 * Math.PI / 180));
}

/* ---------- map ---------- */
const startView = (() => {
  const m = /^#(\d+(?:\.\d+)?)\/(-?\d+\.\d+)\/(-?\d+\.\d+)$/.exec(location.hash);
  return m ? {zoom:+m[1], lat:+m[2], lon:+m[3]} : {zoom:PIN.zoom, lat:PIN.lat, lon:PIN.lon};
})();

const map = L.map("map", {preferCanvas:true, zoomControl:true, worldCopyJump:false})
  .setView([startView.lat, startView.lon], startView.zoom);

/* Two keyless basemaps. OSM raster is darkened in CSS rather than pulling a
   dark tile set, because every hosted dark basemap now wants an API key. */
const LAYERS = {
  dark: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:19, className:"tiles-dark"
  }),
  satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics',
    maxZoom:19
  })
};
let layerName = "dark";
LAYERS.dark.addTo(map);

const dots = L.layerGroup().addTo(map);

function paint(c){
  const mk = markers.get(c.i);
  if (!mk) return;
  const isAnchor = c.i === anchor.i;
  const onWall   = feeds.some(f => f.cam.i === c.i);
  mk.setStyle({
    radius: isAnchor ? 7 : onWall ? 5.5 : c.o ? 4 : 3,
    color: isAnchor ? "#ffffff" : onWall ? "#4ec98a" : "transparent",
    weight: isAnchor ? 2 : onWall ? 1.5 : 0,
    fillColor: !c.o ? "#e0644f" : (c.e || c.u) ? "#b79cf0" : c.v ? "#4ec98a" : "#f0a132",  // purple = embed, green = HLS
    fillOpacity: c.o ? (isAnchor || onWall ? 1 : .72) : .45
  });
}

function drawMarkers(){
  dots.clearLayers();
  markers = new Map();
  ALL.forEach(c => {
    const mk = L.circleMarker([c.y, c.x], {interactive:true, bubblingMouseEvents:false});
    mk.bindTooltip(c.n + (c.u ? " · webcam" : c.e ? " · broadcast stream" : c.v ? " · live video" : "") + (c.o ? "" : " — offline"), {direction:"top", offset:[0,-4]});
    mk.on("click", () => select(c, false));
    mk.addTo(dots);
    markers.set(c.i, mk);
  });
  ALL.forEach(paint);
}

function inView(){
  const b = map.getBounds(), ctr = map.getCenter();
  return ALL
    .filter(c => b.contains([c.y, c.x]))
    .map(c => ({...c, d: metresFrom(c, ctr.lat, ctr.lng)}))
    .sort((a, b2) => a.d - b2.d);
}

/* Zoomed in tight, the bounds can hold two cameras while thirty sit a block
   outside — 9 Ave @ 49 St has 2 within 250 m but 32 within 750 m. Showing only
   what's strictly in frame hides them, so pad up to a floor with the nearest
   ones outside and label them as such. */
const RAIL_FLOOR = 12;
function workingSet(){
  const ctr = map.getCenter(), b = map.getBounds();
  const scored = ALL
    .map(c => ({...c, d: metresFrom(c, ctr.lat, ctr.lng), out: !b.contains([c.y, c.x])}))
    .sort((p, q) => p.d - q.d);
  const inside = scored.filter(c => !c.out);
  const floor = Math.max(tiles, RAIL_FLOOR);
  if (inside.length >= floor) return inside;
  return inside.concat(scored.filter(c => c.out).slice(0, floor - inside.length));
}

function searchHits(){
  const q = query.trim().toLowerCase();
  const ctr = map.getCenter();
  return ALL
    .filter(c => c.n.toLowerCase().includes(q))
    .map(c => ({...c, d: metresFrom(c, ctr.lat, ctr.lng)}))
    .sort((a, b) => a.d - b.d);
}

/* ---------- geocoding ----------
   NYC GeoSearch (Planning Labs) resolves street addresses authoritatively but
   knows nothing about landmarks; Photon knows landmarks. Nominatim would cover
   both but 403s any request a browser can send, since it wants an identifying
   User-Agent header that fetch() is not allowed to set. So: run both, merge. */
const NYC_BBOX = "-74.30,40.47,-73.68,40.93";
let places = [], geoBusy = false, geoSeq = 0, placePin = null, pendingAnchor = null;

async function geosearchNYC(q){
  const r = await fetch("https://geosearch.planninglabs.nyc/v2/autocomplete?size=5&text=" + encodeURIComponent(q));
  if (!r.ok) throw new Error("geosearch " + r.status);
  const j = await r.json();
  return (j.features || []).map(f => ({
    label: f.properties.label || f.properties.name,
    sub:   [f.properties.borough, f.properties.postalcode].filter(Boolean).join(" · "),
    lat:   f.geometry.coordinates[1],
    lon:   f.geometry.coordinates[0]
  }));
}

async function photon(q){
  const r = await fetch("https://photon.komoot.io/api/?limit=5&bbox=" + NYC_BBOX + "&q=" + encodeURIComponent(q));
  if (!r.ok) throw new Error("photon " + r.status);
  const j = await r.json();
  return (j.features || []).map(f => {
    const p = f.properties;
    const street = [p.housenumber, p.street].filter(Boolean).join(" ");
    return {
      label: p.name || street || p.city,
      sub:   [street && p.name ? street : null, p.district || p.city, p.postcode].filter(Boolean).join(" · "),
      lat:   f.geometry.coordinates[1],
      lon:   f.geometry.coordinates[0]
    };
  });
}

async function geocode(q){
  const seq = ++geoSeq;
  geoBusy = true;
  buildRail();
  const settled = await Promise.allSettled([geosearchNYC(q), photon(q)]);
  if (seq !== geoSeq) return;                       // a newer keystroke won
  const merged = [];
  const seen = new Set();
  settled.forEach(s => {
    if (s.status !== "fulfilled") return;
    s.value.forEach(p => {
      if (!p.label || !isFinite(p.lat)) return;
      const key = p.lat.toFixed(4) + "," + p.lon.toFixed(4);
      if (seen.has(key)) return;
      seen.add(key);
      merged.push(p);
    });
  });
  places = merged.slice(0, 6);
  geoBusy = false;
  buildRail();
}

function goToPlace(p){
  if (placePin) map.removeLayer(placePin);
  placePin = L.marker([p.lat, p.lon], {
    icon: L.divIcon({className:"", html:'<div class="place-pin"></div>', iconSize:[15,15], iconAnchor:[7,7]}),
    zIndexOffset: 1000, interactive: false
  }).addTo(map);
  placePin.bindTooltip(p.label, {direction:"top", offset:[0,-10]});

  document.getElementById("q").value = "";
  query = "";
  places = [];

  /* Framing on the address alone lands at a zoom where no camera is in bounds,
     so fit the address together with the cameras that actually cover it. */
  const near = ALL
    .map(c => ({c, d: metresFrom(c, p.lat, p.lon)}))
    .filter(o => o.d <= 2000)
    .sort((a, b) => a.d - b.d)
    .slice(0, Math.max(tiles, 3));

  if (!near.length){ map.setView([p.lat, p.lon], 15); return; }

  pendingAnchor = near[0].c;
  map.fitBounds(
    L.latLngBounds([[p.lat, p.lon], ...near.map(o => [o.c.y, o.c.x])]).pad(0.25),
    {maxZoom: 17}
  );
}

/* ---------- feed tile ---------- */
/* Builds the two crossfading <img> layers and returns a poll function. Shared by
   still-only cameras and by video cameras that have fallen back. */
function attachStills(root, cam, msg, onOk, onFail){
  const box = root.querySelector(".feed-img");
  let imgs = box.querySelectorAll("img");
  if (imgs.length < 2){
    box.insertAdjacentHTML("afterbegin", '<img alt=""><img alt="">');
    imgs = box.querySelectorAll("img");
  }
  imgs.forEach(i => i.alt = "Live traffic camera frame: " + cam.n);

  let front = 0, inFlight = false;
  return function poll(){
    if (inFlight) return;
    inFlight = true;
    const next  = imgs[1 - front];
    const probe = new Image();
    probe.onload = () => {
      inFlight = false;
      next.src = probe.src;
      next.classList.add("on");
      imgs[front].classList.remove("on");
      front = 1 - front;
      msg.hidden = true;
      onOk();
    };
    probe.onerror = () => { inFlight = false; onFail(); };
    probe.src = frameUrl(cam);
  };
}

function makeFeed(cam, offset){
  const root = document.createElement("div");

  /* ---- embedded stream: a YouTube broadcast (cam.e) or an operator's own
         public embed player, e.g. Windy's (cam.u) ---- */
  if (cam.e || cam.u){
    const src = cam.u ||
      "https://www.youtube-nocookie.com/embed/" + cam.e +
      "?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1";
    root.className = "feed isvideo isembed";
    root.innerHTML =
      '<div class="feed-img">' +
        '<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen ' +
          'referrerpolicy="strict-origin-when-cross-origin" title="' + cam.n + '" ' +
          'src="' + src + '"></iframe>' +
        '<span class="badge">' + (cam.u ? "webcam" : "broadcast") + '</span>' +
      '</div>' +
      '<div class="feed-meta"><span class="nm"></span><span class="co"></span></div>';
    const co2 = root.querySelector(".co");
    root.querySelector(".nm").textContent = cam.n;
    const f2 = {
      el: root, cam, offset,
      poll(){}, destroy(){},
      setDist(d){ co2.textContent = fmt(d); root.title = cam.n + " · " + fmt(d) + " from map centre"; },
      health: () => "live",
      lastOk: () => Date.now()
    };
    f2.setDist(cam.d || 0);
    return f2;                                   // no click-to-anchor: the iframe owns its clicks
  }

  root.className = "feed" + (cam.v ? " isvideo" : "");
  root.innerHTML =
    '<div class="feed-img">' +
      (cam.v ? '<video muted autoplay playsinline></video>'
             : '<img alt=""><img alt="">') +
      '<div class="msg">acquiring signal</div>' +
      (cam.v ? '<span class="badge">live video</span>' : '') +
    '</div>' +
    '<div class="feed-meta"><span class="nm"></span><span class="co"></span></div>';

  const msg = root.querySelector(".msg");
  const co  = root.querySelector(".co");
  root.querySelector(".nm").textContent = cam.n;

  let fails = 0, lastOk = 0, hls = null;

  /* ---- live video: NYSDOT publishes HLS with permissive CORS ----
     Municipal streams stall often, and some browsers refuse to run video off
     screen, so a stalled tile falls back to polling the same camera's stills
     rather than sitting on a frozen frame. */
  if (cam.v){
    const vid = root.querySelector("video");
    vid.addEventListener("playing", () => { msg.hidden = true; lastOk = Date.now(); fails = 0; });
    vid.addEventListener("timeupdate", () => { lastOk = Date.now(); });
    /* Muted autoplay is permitted but not automatic — ask for it explicitly. */
    const kick = () => { const p = vid.play(); if (p) p.catch(() => {}); };
    vid.addEventListener("loadedmetadata", kick);
    vid.addEventListener("canplay", kick);

    if (window.Hls && Hls.isSupported()){
      hls = new Hls({liveDurationInfinity:true, lowLatencyMode:true});
      hls.loadSource(cam.v);
      hls.attachMedia(vid);
      hls.on(Hls.Events.MANIFEST_PARSED, kick);
      hls.on(Hls.Events.ERROR, (_e, data) => {
        if (!data.fatal) return;
        if (++fails >= 3){ msg.hidden = false; msg.textContent = "stream unavailable"; }
        else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else hls.recoverMediaError();
      });
    } else if (vid.canPlayType("application/vnd.apple.mpegurl")){
      vid.src = cam.v;                                   // Safari plays HLS natively
    } else {
      msg.hidden = false; msg.textContent = "no HLS support";
    }

    const f = {
      el: root, cam, offset,
      poll(){ if (f.fellBack) stillPoll(); },
      destroy(){ clearInterval(watch); if (hls) hls.destroy(); },
      setDist(d){ co.textContent = fmt(d); root.title = cam.n + " · " + fmt(d) + " from map centre"; },
      health(){
        if (fails >= 3) return "dead";
        if (!lastOk) return "wait";
        return Date.now() - lastOk < 6000 ? "live" : "stale";
      },
      lastOk: () => lastOk,
      fellBack: false
    };

    /* Swap to still frames if the stream stops advancing. */
    let seen = -1, strikes = 0, stillPoll = () => {};
    const watch = setInterval(() => {
      if (f.fellBack) return;
      if (vid.currentTime > seen + 0.25){ seen = vid.currentTime; strikes = 0; return; }
      if (++strikes < 3) return;
      f.fellBack = true;
      clearInterval(watch);
      if (hls) { hls.destroy(); hls = null; }
      vid.remove();
      const badge = root.querySelector(".badge");
      if (badge){ badge.textContent = "stills"; badge.style.color = "var(--ink-dim)"; badge.style.borderColor = "var(--line)"; }
      root.classList.remove("isvideo");
      stillPoll = attachStills(root, cam, msg, () => { fails = 0; lastOk = Date.now(); },
                                                () => { if (++fails >= 3){ msg.hidden = false; msg.textContent = "no signal"; } });
      stillPoll();
    }, 2500);

    f.setDist(cam.d || 0);
    root.addEventListener("click", () => select(cam, false));
    return f;
  }

  /* ---- still-frame branch ---- */
  const rawPoll = attachStills(root, cam, msg,
    () => { fails = 0; lastOk = Date.now(); },
    () => { if (++fails >= 3){ msg.hidden = false; msg.textContent = "no signal"; } });

  /* Mesonet: resolve the hourly URL first, then poll; re-resolve every 4 min. */
  let poll = rawPoll, mesoTimer = null;
  if (cam.m){
    msg.textContent = "resolving latest frame";
    poll = () => { if (cam._resolved) rawPoll(); };
    resolveMesonet(cam).then(u => { if (u) rawPoll(); else { msg.hidden = false; msg.textContent = "no frame"; } });
    mesoTimer = setInterval(() => resolveMesonet(cam), 240000);
  }

  const f = {
    el: root, cam, offset, poll,
    destroy(){ if (mesoTimer) clearInterval(mesoTimer); },
    setDist(d){ co.textContent = fmt(d); root.title = cam.n + " · " + fmt(d) + " from map centre"; },
    health(){
      if (fails >= 3) return "dead";
      if (!lastOk) return "wait";
      return Date.now() - lastOk < 6000 ? "live" : "stale";
    },
    lastOk: () => lastOk
  };
  f.setDist(cam.d || 0);
  root.addEventListener("click", () => select(cam, false));
  return f;
}

/* ---------- rail ---------- */
function buildRail(){
  const searching = query.trim().length > 0;
  const list = searching ? searchHits() : workingSet();
  const shown = list.slice(0, 300);
  rail.textContent = "";

  /* When searching, places come first — an address is usually what you meant. */
  if (searching){
    const ph = document.createElement("div");
    ph.className = "grp";
    ph.textContent = "Places";
    rail.appendChild(ph);

    if (geoBusy && !places.length){
      const s = document.createElement("div");
      s.className = "searching";
      s.textContent = "looking up address…";
      rail.appendChild(s);
    } else if (!places.length){
      const s = document.createElement("div");
      s.className = "searching";
      s.textContent = "no address match";
      rail.appendChild(s);
    } else {
      places.forEach(p => {
        const b = document.createElement("button");
        b.className = "place";
        b.innerHTML = '<span class="pin">&#9679;</span><span class="lab"></span><span class="sub"></span>';
        b.querySelector(".lab").textContent = p.label;
        b.querySelector(".sub").textContent = p.sub || "";
        b.title = p.label + (p.sub ? " — " + p.sub : "");
        b.addEventListener("click", () => goToPlace(p));
        rail.appendChild(b);
      });
    }
  }

  if (!list.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = searching
      ? 'No camera name matches "' + query + '".'
      : "No cameras in view. Zoom out or pan to a covered area.";
    rail.appendChild(e);
    tally.textContent = searching
      ? places.length + " place" + (places.length === 1 ? "" : "s") + " · 0 camera names"
      : "0 of " + ALL.length + " cameras";
    return;
  }

  const h = document.createElement("div");
  h.className = "grp";
  h.textContent = searching ? "Cameras by name" : "In view";
  rail.appendChild(h);

  let outHeaderDone = false;
  shown.forEach(cam => {
    if (!searching && cam.out && !outHeaderDone){
      outHeaderDone = true;
      const oh = document.createElement("div");
      oh.className = "grp";
      oh.textContent = "Nearby, just outside view";
      rail.appendChild(oh);
    }
    const b = document.createElement("button");
    b.className = "cam" + (cam.o ? "" : " off");
    b.setAttribute("aria-current", String(cam.i === anchor.i));
    b.innerHTML = '<span class="nmx"></span><span class="dist"></span>';
    b.querySelector(".nmx").textContent = cam.n;
    b.querySelector(".dist").textContent = cam.o ? fmt(cam.d) : "offline";
    b.addEventListener("click", () => select(cam, true));
    rail.appendChild(b);
  });

  tally.textContent =
    list.length + (searching ? " matches" : " in view") + " · " + ALL.length + " total" +
    (list.length > shown.length ? " · first " + shown.length + " listed" : "");
}

/* ---------- wall (reuses tiles across rebuilds so panning doesn't blank it) ---------- */
function build(fromMap){
  const pool = (query.trim() ? searchHits() : workingSet());
  let picks = [];

  /* A map move with Follow on re-anchors to whatever is nearest the new centre.
     An explicit pick keeps its anchor and fills outward from it. */
  const ai = fromMap ? -1 : pool.findIndex(c => c.i === anchor.i);
  if (ai >= 0){
    for (let k = 0; picks.length < tiles && k < pool.length; k++) picks.push(pool[(ai + k) % pool.length]);
  } else {
    picks = pool.slice(0, tiles);
    if (!picks.length) picks = [{...anchor, d:0}];
    anchor = picks[0];
  }

  const keep = new Map(feeds.map(f => [f.cam.i, f]));
  feeds = picks.map((c, idx) => {
    let f = keep.get(c.i);
    if (f){ keep.delete(c.i); f.offset = idx / picks.length; f.setDist(c.d || 0); }
    else   { f = makeFeed(c, idx / picks.length); f.poll(); }
    f.el.classList.toggle("sel", c.i === anchor.i);
    wall.appendChild(f.el);
    return f;
  });
  keep.forEach(f => { f.destroy(); f.el.remove(); });   // tear down HLS, don't leak the buffer

  wall.className = "wall n" + tiles;
  curNm.textContent = tiles === 1 ? anchor.n : anchor.n + " + " + (feeds.length - 1);
  ALL.forEach(paint);
}

function select(cam, pan){
  anchor = cam;
  if (pan && map.getZoom() < 14) map.setView([cam.y, cam.x], 16);
  else if (pan && !map.getBounds().contains([cam.y, cam.x])) map.panTo([cam.y, cam.x]);
  buildRail();
  build();
}

/* ---------- polling clock, staggered ---------- */
function loop(){
  clearInterval(timer);
  if (!period) return;
  timer = setInterval(() => {
    feeds.forEach(f => {
      const delay = f.offset * period;
      if (delay < 20) f.poll();
      else setTimeout(() => f.poll(), delay);
    });
  }, period);
}

setInterval(() => {
  const h = feeds.length ? feeds[0].health() : "wait";
  dot.className = "dot " + (h === "wait" ? "" : h);
  const lead = feeds.length ? feeds[0].cam : null;
  if (lead && lead.u) stat.textContent = "webcam · operator embed";
  else if (lead && lead.e) stat.textContent = "broadcast stream · continuous video";
  else if (lead && lead.v && h === "live") stat.textContent = "live video · HLS stream";
  else if (!period) stat.textContent = "held";
  else if (h === "live")
    stat.textContent = "live · polling " + (period / 1000) + "s · last frame " +
      ((Date.now() - feeds[0].lastOk()) / 1000).toFixed(1) + "s ago";
  else if (h === "stale") stat.textContent = "stale — no new frame in 6s";
  else if (h === "dead")  stat.textContent = "camera offline";
  else stat.textContent = "connecting";
}, 400);

/* ---------- map wiring ---------- */
let moveTimer = null;
function onMove(){
  const c = map.getCenter(), z = map.getZoom();
  history.replaceState(null, "", "#" + z + "/" + c.lat.toFixed(5) + "/" + c.lng.toFixed(5));
  const n = inView().length;
  const near = ALL.filter(k => metresFrom(k, c.lat, c.lng) <= 750).length;
  hint.textContent = "z" + z + " · " + n + " in view" +
    (near > n ? " · " + near + " within 750 m" : "");
  clearTimeout(moveTimer);
  moveTimer = setTimeout(() => {
    if (pendingAnchor){ anchor = pendingAnchor; pendingAnchor = null; build(false); }
    else if (follow) build(true);
    buildRail();
  }, 220);
}
map.on("moveend zoomend", onMove);

document.getElementById("btnFollow").addEventListener("click", e => {
  follow = !follow;
  e.currentTarget.setAttribute("aria-pressed", String(follow));
  if (follow) build();
});
document.getElementById("btnLayer").addEventListener("click", e => {
  map.removeLayer(LAYERS[layerName]);
  layerName = layerName === "dark" ? "satellite" : "dark";
  LAYERS[layerName].addTo(map).bringToBack();
  e.currentTarget.textContent = layerName === "dark" ? "Satellite" : "Street map";
});
document.getElementById("btnHome").addEventListener("click", () => map.setView([PIN.lat, PIN.lon], PIN.zoom));
document.getElementById("btnAll").addEventListener("click", () => map.setView([40.7050, -73.9400], 11));

const mapwrap = document.getElementById("mapwrap");
const splitter = document.getElementById("splitter");
document.getElementById("btnMap").addEventListener("click", e => {
  const off = mapwrap.classList.toggle("collapsed");
  splitter.hidden = off;
  e.currentTarget.setAttribute("aria-pressed", String(!off));
  if (!off) map.invalidateSize();
});

(function resizable(){
  let dragging = false;
  const move = e => {
    if (!dragging) return;
    const top = mapwrap.getBoundingClientRect().top;
    const h = Math.max(120, Math.min(window.innerHeight - 220, e.clientY - top));
    mapwrap.style.height = h + "px";
    map.invalidateSize();
  };
  splitter.addEventListener("mousedown", e => { dragging = true; e.preventDefault(); });
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", () => { dragging = false; });
  splitter.addEventListener("keydown", e => {
    const cur = mapwrap.getBoundingClientRect().height;
    if (e.key === "ArrowUp"){ mapwrap.style.height = Math.max(120, cur - 30) + "px"; map.invalidateSize(); e.preventDefault(); }
    if (e.key === "ArrowDown"){ mapwrap.style.height = Math.min(window.innerHeight - 220, cur + 30) + "px"; map.invalidateSize(); e.preventDefault(); }
  });
})();

/* ---------- controls ---------- */
const qEl = document.getElementById("q");
let geoTimer = null;
qEl.addEventListener("input", e => {
  query = e.target.value;
  buildRail();
  clearTimeout(geoTimer);
  const q = query.trim();
  if (q.length < 3){ places = []; geoBusy = false; buildRail(); return; }
  geoTimer = setTimeout(() => geocode(q), 320);
});
qEl.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  clearTimeout(geoTimer);
  if (places.length) return goToPlace(places[0]);
  const hits = searchHits();
  if (hits.length) return select(hits[0], true);
  const q = query.trim();
  if (q.length >= 3) geocode(q).then(() => { if (places.length) goToPlace(places[0]); });
});

document.querySelectorAll("[data-ms]").forEach(b => b.addEventListener("click", () => {
  period = Number(b.dataset.ms);
  document.querySelectorAll("[data-ms]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  loop();
  if (period) feeds.forEach(f => f.poll());
}));

const MAX_TILES = 10;
document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => {
  tiles = Math.min(MAX_TILES, Number(b.dataset.n));
  document.querySelectorAll("[data-n]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  build();
  loop();
}));

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.classList.contains("splitter")) return;
  const list = query.trim() ? searchHits() : inView();
  const i = list.findIndex(c => c.i === anchor.i);
  if (e.key === "ArrowDown" || e.key === "ArrowRight"){
    e.preventDefault(); if (list.length) select(list[(i + 1 + list.length) % list.length], true);
  } else if (e.key === "ArrowUp" || e.key === "ArrowLeft"){
    e.preventDefault(); if (list.length) select(list[(i - 1 + list.length) % list.length], true);
  } else if (e.key === " "){
    e.preventDefault();
    (period ? document.querySelector('[data-ms="0"]') : document.querySelector('[data-ms="1000"]')).click();
  }
});

/* ---------- boot ---------- */
function prepare(rows){
  ALL = rows.slice();
  byId = new Map(ALL.map(c => [c.i, c]));
  drawMarkers();
  const pool = inView();
  anchor = pool.find(c => c.o) || pool[0] || ALL[0];
  buildRail();
  build();
  loop();
  onMove();
}

prepare(SEED);

/* revalidate rather than trusting the 10-minute CDN cache, so a refreshed
   camera index reaches open pages instead of going stale for ten minutes.
   Unchanged data comes back as a 304, so this costs a header round-trip. */
fetch("cameras.json", {cache: "no-cache"})
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(rows => { if (Array.isArray(rows) && rows.length) prepare(rows); })
  .catch(() => { tally.textContent = SEED.length + " cameras (full index unavailable offline)"; });
</script>
